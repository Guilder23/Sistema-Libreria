<div class="modal fade" id="modalVerProducto" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content modal-ver-productos">
            <div class="modal-header">
                <h5 class="modal-title">Ver Producto</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <ul class="list-group">
                    <li class="list-group-item"><strong>Nombre:</strong> <span id="verNombre"></span></li>
                    <li class="list-group-item"><strong>Codigo:</strong> <span id="verCodigo"></span></li>
                    <li class="list-group-item"><strong>Detalle:</strong> <span id="verDetalle"></span></li>
                    <li class="list-group-item"><strong>Categoria:</strong> <span id="verCategoria"></span></li>
                    <li class="list-group-item"><strong>Stock:</strong> <span id="verStock"></span></li>
                    <li class="list-group-item"><strong>Precio USD:</strong> <span id="verPrecioUsd"></span></li>
                    <li class="list-group-item"><strong>Precio Bs:</strong> <span id="verPrecioBs"></span></li>
                    <li class="list-group-item">
                        <strong>Imagen:</strong>
                        <div class="mt-2">
                            <img id="verImagen" src="" alt="Imagen producto" style="max-width: 100%; max-height: 220px; display: none; border-radius: 6px; border: 1px solid #ddd;">
                            <span id="verImagenSinDato" class="text-muted">Sin imagen</span>
                        </div>
                    </li>
                </ul>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary">Guardar</button>
            </div>
        </div>
    </div>
</div>
